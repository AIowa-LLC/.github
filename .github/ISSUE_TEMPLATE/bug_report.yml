name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please remove secrets, credentials, and private data from anything you submit.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem clearly and concisely.
      placeholder: Tell us what went wrong.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: Describe the expected behavior.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Provide the smallest reliable set of steps.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: Version, branch, or commit SHA

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, runtime, browser, model/provider, deployment target, or other relevant details.

  - type: textarea
    id: logs
    attributes:
      label: Logs or additional context
      description: Paste relevant logs or screenshots with secrets and private data removed.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed secrets, credentials, and private data.
          required: true
